<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengujian Unit - Portfolio Dina</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .test-wrap { max-width: 820px; margin: 50px auto; padding: 0 20px; }
        .test-list { list-style: none; padding: 0; margin: 24px 0; }
        .test-list li { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem; border: 1px solid var(--border); }
        .test-list li.pass { background: var(--accent-soft); border-color: var(--accent); }
        .test-list li.fail { background: color-mix(in srgb, var(--danger) 12%, transparent); border-color: var(--danger); }
        .summary { font-size: 1.1rem; font-weight: 800; }
        .summary.pass { color: var(--accent); }
        .summary.fail { color: var(--danger); }
    </style>
</head>
<body>
    <div class="test-wrap">
        <p class="eyebrow">J.620100.033.02</p>
        <h1>Pengujian Unit Program</h1>
        <p class="section-subtitle">Halaman ini menguji fungsi-fungsi utama pada <code>main.js</code> secara otomatis saat dibuka.</p>
        <p class="summary" id="summary">Menjalankan pengujian...</p>
        <ul class="test-list" id="test-list"></ul>
        <a href="index.html" class="btn btn-outline">← Kembali ke Portfolio</a>
    </div>

    <script src="main.js"></script>
    <script src="test-runner.js"></script>
</body>
</html>
